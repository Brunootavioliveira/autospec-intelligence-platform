spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: simple

jwt:
  secret: test-secret-key-for-integration-tests-must-be-at-least-32-bytes-long
  expiration: 3600000

app:
  security:
    crypto-key: test-crypto-key-32-bytes-long!!
    hmac-secret: test-hmac-secret
  retention:
    specs-months: 6
    history-months: 12
    sessions-days: 30